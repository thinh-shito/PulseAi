syntax = "proto3";

package ai;

// Service to handle clinical text anonymization and Prior Authorization workflows.
service AiService {
  // Filters PHI (Protected Health Information) from clinical text before LLM consumption.
  rpc AnonymizeText (AnonymizeRequest) returns (AnonymizeResponse);

  // Executes the LangGraph prior authorization workflow, streaming node events back.
  rpc StartWorkflow (StartWorkflowRequest) returns (stream WorkflowEvent);

  // Generates and overlays PDF report for the workflow
  rpc ExportPdf (ExportPdfRequest) returns (ExportPdfResponse);

  // Extracts text from uploaded files (PDF, DOCX, TXT, Images)
  rpc ExtractText (ExtractTextRequest) returns (ExtractTextResponse);
}

message AnonymizeRequest {
  string raw_text = 1;
  string patient_id = 2;
}

message AnonymizeResponse {
  string anonymized_text = 1;
}

message StartWorkflowRequest {
  string patient_id = 1;
  string anonymized_text = 2;
  string workflow_id = 3;
}

message WorkflowEvent {
  string node_name = 1;
  string status = 2;
  repeated string icd10_codes = 3;
  float confidence_score = 4;
  string payer_type = 5;
  float quality_score = 6;
  string state_json = 7;      // JSON string representation of the full AgentState
  string error_message = 8;
  int32 retry_count = 9;
}

message ExportPdfRequest {
  string workflow_id = 1;
  string status = 2;
  string payer_type = 3;
  float quality_score = 4;
  string patient_id = 5;
  string fields_json = 6;
  string template_file_content_base64 = 7;
  string template_fields_json = 8;
}

message ExportPdfResponse {
  bytes pdf_bytes = 1;
}

message ExtractTextRequest {
  string file_name = 1;
  bytes file_bytes = 2;
}

message ExtractTextResponse {
  string extracted_text = 1;
}
