[project]
name = "pulseai-ai-service"
version = "1.0.0"
description = "PulseAI FastAPI AI service for LangGraph prior authorization workflows"
readme = "DATABASE.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langgraph>=0.1.0",
    "langsmith>=0.1.0",
    "openai>=1.35.0",
    "db-query-agent>=0.1.0",
    "docx2txt>=0.8",
    "pypdf>=4.0.0",
    "psycopg2-binary>=2.9.0",
    "python-docx>=1.1.0",
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]