version: "3.9"

services:
  # ─── Python gRPC AI Service (LangGraph + PHI anonymization) ─────────────────
  ai-service:
    build:
      context: ./src-backend
      dockerfile: Dockerfile
    container_name: pulseai-ai-service
    env_file: .env
    environment:
      - GRPC_PORT=50051
    # gRPC port is internal-only — NestJS is the only consumer
    networks:
      - pulseai-internal
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m app.grpc_server
    restart: unless-stopped

  # ─── NestJS API Gateway (REST/SSE + JWT auth + Prisma ORM + gRPC client) ────
  backend:
    build:
      context: ./src-backend-nestjs
      dockerfile: Dockerfile
    container_name: pulseai-backend
    env_file: .env
    environment:
      - AI_SERVICE_URL=ai-service:50051
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - pulseai-internal
      - pulseai-external
    restart: unless-stopped

  # ─── PostgreSQL (internal only) ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pulseai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulseai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pulseai_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NOTE: No public port exposed — internal network only
    networks:
      - pulseai-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulseai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Redis (session / rate-limit / internal only) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pulseai-redis
    # NOTE: No public port exposed — internal network only
    networks:
      - pulseai-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
    restart: unless-stopped

  # ─── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./src-frontend
      dockerfile: Dockerfile
    container_name: pulseai-frontend
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - pulseai-external
    restart: unless-stopped

networks:
  pulseai-internal:
    driver: bridge
    internal: true   # DB/Redis/AI-service: no outbound internet access
  pulseai-external:
    driver: bridge   # NestJS backend + Frontend: controlled outbound access

volumes:
  postgres_data:
    driver: local
