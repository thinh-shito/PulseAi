version: "3.9"

services:
  # ─── Python gRPC AI Service ────────────────────────────────────────────────
  ai-service:
    image: pulseai-ai-service:latest
    build:
      context: ./src-backend
      dockerfile: Dockerfile.prod
    container_name: pulseai-ai-service
    env_file: .env
    environment:
      - GRPC_PORT=50051
    networks:
      - pulseai-internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # ─── NestJS API Gateway ───────────────────────────────────────────────────
  backend:
    image: pulseai-backend:latest
    build:
      context: ./src-backend-nestjs
      dockerfile: Dockerfile
    container_name: pulseai-backend
    env_file: .env
    environment:
      - AI_SERVICE_URL=ai-service:50051
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - pulseai-internal
      - pulseai-external
    restart: always

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pulseai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulseai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pulseai_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pulseai-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pulseai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pulseai-redis
    networks:
      - pulseai-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
    restart: always

  # ─── Next.js Frontend ─────────────────────────────────────────────────────
  frontend:
    image: pulseai-frontend:latest
    build:
      context: ./src-frontend
      dockerfile: Dockerfile.prod
    container_name: pulseai-frontend
    environment:
      - HOSTNAME=0.0.0.0
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - pulseai-external
    restart: always

networks:
  pulseai-internal:
    driver: bridge
    internal: true   # DB/Redis/AI-service: no outbound internet
  pulseai-external:
    driver: bridge   # NestJS + Frontend: controlled outbound access

volumes:
  postgres_data:
    driver: local
